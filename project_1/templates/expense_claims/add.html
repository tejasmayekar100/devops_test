{% extends "base.html" %}
{% block title %}New Expense Claim{% endblock %}
{% block content %}
<h3>New Expense Claim</h3>
<form method="POST" style="max-width: 600px;">
    <div class="mb-3">
        <label class="form-label">Travel Request ID</label>
        <input type="number" name="travel_request_id" class="form-control" required>
        <div class="form-text">Must reference an APPROVED travel request of yours.</div>
    </div>

    <hr>
    <h5>Expense Items</h5>
    <p class="text-muted small">Add one or more rows. Category IDs: see Expense Categories page.</p>

    <div id="items-container">
        <div class="row g-2 mb-2 item-row">
            <div class="col-2"><input type="number" name="category_id" class="form-control" placeholder="Category ID" required></div>
            <div class="col-4"><input type="text" name="description" class="form-control" placeholder="Description" required></div>
            <div class="col-2"><input type="number" step="0.01" name="amount" class="form-control" placeholder="Amount" required></div>
            <div class="col-3"><input type="date" name="expense_date" class="form-control" required></div>
        </div>
    </div>

    <button type="button" class="btn btn-sm btn-outline-secondary mb-3" onclick="addItemRow()">+ Add another item</button>
    <br>
    <button type="submit" class="btn btn-primary">Submit Claim</button>
    <a href="/expense-claims" class="btn btn-secondary">Cancel</a>
</form>

<script>
function addItemRow() {
    const container = document.getElementById("items-container");
    const row = container.querySelector(".item-row").cloneNode(true);
    row.querySelectorAll("input").forEach(function(input) { input.value = ""; });
    container.appendChild(row);
}
</script>
{% endblock %}
