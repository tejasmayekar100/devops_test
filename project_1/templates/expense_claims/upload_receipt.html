{% extends "base.html" %}
{% block title %}Upload Receipt{% endblock %}
{% block content %}
<h3>Upload Receipt for Expense Item #{{ expense_item_id }}</h3>
<form method="POST" enctype="multipart/form-data" style="max-width: 400px;">
    <div class="mb-3">
        <label class="form-label">Receipt File (PDF, PNG, JPG - max 5MB)</label>
        <input type="file" name="file" class="form-control" accept=".pdf,.png,.jpg,.jpeg" required>
    </div>
    <button type="submit" class="btn btn-primary">Upload</button>
    <a href="/expense-claims" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
