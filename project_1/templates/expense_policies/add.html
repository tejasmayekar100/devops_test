{% extends "base.html" %}
{% block title %}New Policy{% endblock %}
{% block content %}
<h3>New Expense Policy</h3>
<form method="POST" style="max-width: 400px;">
    <div class="mb-3">
        <label class="form-label">Category ID</label>
        <input type="number" name="category_id" class="form-control" required>
        <div class="form-text">See Expense Categories page for the ID.</div>
    </div>
    <div class="mb-3">
        <label class="form-label">Maximum Amount</label>
        <input type="number" step="0.01" name="maximum_amount" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Create</button>
    <a href="/expense-policies" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
