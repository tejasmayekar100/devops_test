{% extends "base.html" %}
{% block title %}New Travel Request{% endblock %}
{% block content %}
<h3>New Travel Request</h3>
<form method="POST" style="max-width: 500px;">
    <div class="mb-3">
        <label class="form-label">Destination</label>
        <input type="text" name="destination" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Purpose</label>
        <input type="text" name="purpose" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Start Date</label>
        <input type="date" name="start_date" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">End Date</label>
        <input type="date" name="end_date" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Estimated Amount</label>
        <input type="number" step="0.01" name="estimated_amount" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Submit Request</button>
    <a href="/travel-requests" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
